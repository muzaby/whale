<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whale — Image Tuning Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/primitives.jsx"></script>
<script type="text/babel" src="components/home.jsx"></script>
<script type="text/babel" src="components/e2e_pipeline.jsx"></script>
<script type="text/babel" src="components/compare.jsx"></script>
<script type="text/babel" src="components/tuning_panel.jsx"></script>
<script type="text/babel" src="components/e2e_page.jsx"></script>
<script type="text/babel" src="components/library.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "ocean",
  "density": "comfortable",
  "monoMeta": true
}/*EDITMODE-END*/;

const App = () => {
  const [page, setPage] = React.useState(() => localStorage.getItem("whale:page") || "home");
  const [tweaksOn, setTweaksOn] = React.useState(false);
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);

  React.useEffect(() => { localStorage.setItem("whale:page", page); }, [page]);

  // Apply accent to document root
  React.useEffect(() => {
    const root = document.documentElement;
    root.setAttribute("data-accent", tweaks.accent === "ocean" ? "" : tweaks.accent);
    root.style.setProperty("--density-pad", tweaks.density === "compact" ? "6px" : tweaks.density === "spacious" ? "16px" : "10px");
  }, [tweaks]);

  // Edit-mode handshake
  React.useEffect(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "__activate_edit_mode") setTweaksOn(true);
      if (e.data.type === "__deactivate_edit_mode") setTweaksOn(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  const setTweak = (k, v) => {
    const n = { ...tweaks, [k]: v };
    setTweaks(n);
    window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { [k]: v } }, "*");
  };

  const crumb = page === "e2e" ? (
    <>
      <span>sensor-A</span><span className="sep">/</span>
      <span>night-tuning</span><span className="sep">/</span>
      <span style={{ color: "var(--fg)" }}>pass-3 · rev-7</span>
    </>
  ) : page === "library" ? (
    <><span>library</span><span className="sep">/</span><span style={{ color: "var(--fg)" }}>all images</span></>
  ) : null;

  return (
    <div className="app">
      <TopBar page={page} onNav={setPage} crumb={crumb} />
      <div className="content">
        {page === "home" && <Home goto={setPage} />}
        {page === "e2e" && <E2E />}
        {page === "library" && <Library />}
      </div>
      {tweaksOn && <Tweaks tweaks={tweaks} setTweak={setTweak} onClose={() => setTweaksOn(false)} />}
    </div>
  );
};

const Tweaks = ({ tweaks, setTweak, onClose }) => (
  <div className="tweaks">
    <header>
      <span>Tweaks</span>
      <button className="btn sm ghost icon" onClick={onClose}><Icon name="close" size={12} /></button>
    </header>
    <div className="body">
      <div className="tweak-group">
        <span className="t-label">Accent color</span>
        <div className="swatch-row">
          {[
            { k: "ocean",    c: "oklch(0.58 0.13 220)" },
            { k: "teal",     c: "oklch(0.60 0.11 185)" },
            { k: "amber",    c: "oklch(0.70 0.14 55)" },
            { k: "graphite", c: "oklch(0.36 0.02 260)" },
          ].map(s => (
            <button
              key={s.k}
              className={tweaks.accent === s.k ? "active" : ""}
              style={{ background: s.c }}
              onClick={() => setTweak("accent", s.k)}
              title={s.k}
            />
          ))}
        </div>
      </div>
      <div className="tweak-group">
        <span className="t-label">Density</span>
        <Seg value={tweaks.density} onChange={(v) => setTweak("density", v)} options={[
          { v: "compact",      label: "Compact" },
          { v: "comfortable",  label: "Comfortable" },
          { v: "spacious",     label: "Spacious" },
        ]} />
      </div>
      <div className="tweak-group">
        <span className="t-label">Jump to page</span>
        <Seg value={localStorage.getItem("whale:page") || "home"} onChange={(v) => { localStorage.setItem("whale:page", v); location.reload(); }} options={[
          { v: "home", label: "Home" },
          { v: "e2e",  label: "E2E" },
          { v: "library", label: "Library" },
        ]} />
      </div>
      <div style={{ fontFamily: "var(--font-mono)", fontSize: 10, color: "var(--fg-faint)", borderTop: "1px solid var(--divider)", paddingTop: 8 }}>
        hint · try node vs list vs timeline in E2E, split vs slider compare
      </div>
    </div>
  </div>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
