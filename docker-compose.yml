version: '3.9'
services:
  localstack:
    image: localstack/localstack:4.1
    environment:
      - SERVICES=s3,sqs
      - AWS_DEFAULT_REGION=ap-northeast-2
      - DEBUG=0
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack

  backend:
    build:
      context: ./backend
    environment:
      - PORT=4000
      - AWS_REGION=ap-northeast-2
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET=whale-assets-local
      - RENDER_QUEUE=whale-render-queue-local
    ports:
      - "4000:4000"
    depends_on:
      - localstack
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./whale-app
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./whale-app/src:/app/src
      - ./whale-app/index.html:/app/index.html

volumes:
  localstack-data:
